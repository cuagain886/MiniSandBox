        - EXECUTION_NOT_FOUND
        - EXECUTION_LIMIT_REACHED
        - SHELL_NOT_FOUND
        - INVALID_CWD
        - FILES_UNAVAILABLE
        - INVALID_FILE_PATH
        - FILE_NOT_FOUND
        - FILE_TYPE_MISMATCH
        - FILE_CONFLICT
        - FILE_TOO_LARGE
        - PTY_UNAVAILABLE
        - PTY_LIMIT_REACHED
        - INVALID_PORT
        - PORT_PROXY_UNAVAILABLE
        - PORT_UPSTREAM_UNAVAILABLE
        - INTERNAL_ERROR
