openapi: 3.1.0
info:
  title: MiniSandbox Runner API
  version: 0.2.0
servers:
  - url: http://runner
paths:
  /healthz:
    get:
      operationId: runnerHealth
      responses:
        "200":
          description: Runner is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerHealth"
  /v1/capabilities:
    get:
      operationId: getRunnerCapabilities
      description: Reports the features this runner actually provides; never overstates a disabled feature
      responses:
        "200":
          description: Current runner capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/executions:
    post:
      operationId: execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
            examples:
              foregroundArgv:
                value:
                  argv: [go, test, ./...]
                  cwd: /workspace
                  env:
                    CI: "true"
                  timeout_seconds: 120
                  background: false
      responses:
        "200":
          description: Foreground execution event stream ending in exactly one terminal event
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames whose data JSON conforms to ExecutionEvent
        "202":
          description: Background execution was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionDescriptor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/executions/{execution_id}:
    parameters:
      - $ref: "#/components/parameters/ExecutionID"
    get:
      operationId: getExecution
      responses:
        "200":
          description: Current execution state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: cancelExecution
      responses:
        "202":
          description: Cancellation of a running execution was accepted
        "204":
          description: Execution is already terminal
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/executions/{execution_id}/logs:
    parameters:
      - $ref: "#/components/parameters/ExecutionID"
    get:
      operationId: getExecutionLogs
      parameters:
        - $ref: "#/components/parameters/LogCursor"
      responses:
        "200":
          description: Execution events after the supplied sequence cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionLogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    ExecutionID:
      name: execution_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    LogCursor:
      name: cursor
      in: query
      required: false
      description: Last event sequence already read; omitted is equivalent to zero
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Runner request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Runner bearer token is absent or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Execution does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Execution cannot be started with the supplied semantic values
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Execution concurrency limit has been reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Runner failed internally
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Runner cannot currently accept execution
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Capabilities:
      type: object
      additionalProperties: false
      required: [files, pty, http_port_proxy]
      properties:
        files: {type: boolean}
        pty: {type: boolean}
        http_port_proxy: {type: boolean}
    RunnerHealth:
      type: object
      additionalProperties: false
      required: [status, service, version, protocol_version, netns_identity]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: runnerd
        version:
          type: string
          minLength: 1
        protocol_version:
          type: integer
          minimum: 1
          description: Must exactly match the managed container label and control plane version
        netns_identity:
          type: string
          pattern: '^linux-netns:[1-9][0-9]*:[1-9][0-9]*$'
    ExecuteRequest:
      type: object
      additionalProperties: false
      properties:
        argv:
          type: array
          minItems: 1
          prefixItems:
            - type: string
              minLength: 1
          items:
            type: string
        shell:
          type: string
          minLength: 1
        cwd:
          type: string
          description: Container path below /workspace; defaults to /workspace
        env:
          type: object
          additionalProperties:
            type: string
        timeout_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Execution timeout in seconds; zero selects the runner default
        background:
          type: boolean
          default: false
      oneOf:
        - required: [argv]
        - required: [shell]
    ExecutionState:
      type: string
      enum: [Pending, Running, Exited, Failed, Cancelled, TimedOut]
    ExecutionDescriptor:
      type: object
      additionalProperties: false
      required: [execution_id, state]
      properties:
        execution_id:
          type: string
        state:
          $ref: "#/components/schemas/ExecutionState"
    ExecutionStatus:
      type: object
      additionalProperties: false
      required: [execution_id, state]
      properties:
        execution_id:
          type: string
        state:
          $ref: "#/components/schemas/ExecutionState"
        terminal_event:
          $ref: "#/components/schemas/TerminalExecutionEvent"
    ExecutionLogPage:
      type: object
      additionalProperties: false
      required: [events, next_cursor, complete]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionEvent"
        next_cursor:
          type: integer
          format: int64
          minimum: 0
        complete:
          type: boolean
    ExecutionEvent:
      oneOf:
        - $ref: "#/components/schemas/StartedEvent"
        - $ref: "#/components/schemas/StdoutEvent"
        - $ref: "#/components/schemas/StderrEvent"
        - $ref: "#/components/schemas/OutputLimitReachedEvent"
        - $ref: "#/components/schemas/ExitedEvent"
        - $ref: "#/components/schemas/FailedEvent"
        - $ref: "#/components/schemas/CancelledEvent"
        - $ref: "#/components/schemas/TimedOutEvent"
      discriminator:
        propertyName: type
    TerminalExecutionEvent:
      oneOf:
        - $ref: "#/components/schemas/ExitedEvent"
        - $ref: "#/components/schemas/FailedEvent"
        - $ref: "#/components/schemas/CancelledEvent"
        - $ref: "#/components/schemas/TimedOutEvent"
      discriminator:
        propertyName: type
    StartedEvent:
      $ref: "#/components/schemas/ControlEvent"
    OutputLimitReachedEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: output_limit_reached}
    ControlEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: started}
    StdoutEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type, data_base64]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: stdout}
        data_base64: {type: string, format: byte}
    StderrEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type, data_base64]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: stderr}
        data_base64: {type: string, format: byte}
    ExitedEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type, exit_code, duration_ms, output_truncated]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: exited}
        exit_code: {type: integer}
        duration_ms: {type: integer, format: int64, minimum: 0}
        output_truncated: {type: boolean}
    FailedEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type, error_code, message, duration_ms, output_truncated]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: failed}
        error_code: {type: string}
        message: {type: string}
        duration_ms: {type: integer, format: int64, minimum: 0}
        output_truncated: {type: boolean}
    CancelledEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type, duration_ms, output_truncated]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: cancelled}
        duration_ms: {type: integer, format: int64, minimum: 0}
        output_truncated: {type: boolean}
    TimedOutEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type, duration_ms, output_truncated]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: timed_out}
        duration_ms: {type: integer, format: int64, minimum: 0}
        output_truncated: {type: boolean}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code:
          $ref: "#/components/schemas/RunnerErrorCode"
        message: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
    RunnerErrorCode:
      type: string
      enum:
        - INVALID_EXECUTION_REQUEST
        - EXECUTION_NOT_FOUND
        - EXECUTION_LIMIT_REACHED
        - SHELL_NOT_FOUND
        - INVALID_CWD
        - INTERNAL_ERROR
