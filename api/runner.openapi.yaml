openapi: 3.1.0
info:
  title: MiniSandbox Runner API
  version: 0.2.0
servers:
  - url: http://runner
paths:
  /healthz:
    get:
      operationId: runnerHealth
      responses:
        "200":
          description: Runner is healthy
  /v1/executions:
    post:
      operationId: execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
            examples:
              foregroundArgv:
                value:
                  argv: [go, test, ./...]
                  cwd: /workspace
                  env:
                    CI: "true"
                  timeout_seconds: 120
                  background: false
      responses:
        "200":
          description: Execution events
          content:
            text/event-stream:
              schema:
                type: string
  /v1/executions/{execution_id}:
    parameters:
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: cancelExecution
      responses:
        "202":
          description: Cancellation was accepted
        "204":
          description: Execution is already complete
components:
  schemas:
    ExecuteRequest:
      type: object
      additionalProperties: false
      properties:
        argv:
          type: array
          minItems: 1
          prefixItems:
            - type: string
              minLength: 1
          items:
            type: string
        shell:
          type: string
          minLength: 1
        cwd:
          type: string
          description: Container path below /workspace; defaults to /workspace
        env:
          type: object
          additionalProperties:
            type: string
        timeout_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Execution timeout in seconds; zero selects the runner default
        background:
          type: boolean
          default: false
      oneOf:
        - required: [argv]
        - required: [shell]
