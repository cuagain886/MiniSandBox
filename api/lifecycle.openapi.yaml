openapi: 3.1.0
info:
  title: MiniSandbox Lifecycle API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Control plane is healthy
  /readyz:
    get:
      operationId: ready
      responses:
        "200":
          description: Control plane is ready
        "503":
          description: Control plane is not ready
  /v1/sandboxes:
    post:
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
      responses:
        "202":
          description: Sandbox creation was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
  /v1/sandboxes/{sandbox_id}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: getSandbox
      responses:
        "200":
          description: Current sandbox state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
    delete:
      operationId: deleteSandbox
      responses:
        "202":
          description: Sandbox deletion was accepted
        "204":
          description: Sandbox is already absent
components:
  parameters:
    SandboxID:
      name: sandbox_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    CreateSandboxRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
    SandboxState:
      type: string
      enum:
        - Pending
        - Creating
        - Running
        - Stopping
        - Terminated
        - Failed
    SandboxReason:
      type: string
      enum:
        - CREATE_ACCEPTED
        - CREATING_RUNTIME
        - WAITING_RUNNER
        - RUNNING
        - DELETE_ACCEPTED
        - DELETING_RUNTIME
        - TERMINATED
        - IMAGE_PULL_FAILED
        - ARTIFACT_INVALID
        - CONTAINER_CREATE_FAILED
        - ARTIFACT_INJECTION_FAILED
        - CONTAINER_START_FAILED
        - RUNNER_UNHEALTHY
        - SPEC_DRIFT
        - CLEANUP_PENDING
        - RUNTIME_UNAVAILABLE
        - INTERNAL_ERROR
    Sandbox:
      type: object
      additionalProperties: false
      required: [id, state, reason, message, image, created_at, updated_at]
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/SandboxState"
        reason:
          $ref: "#/components/schemas/SandboxReason"
        message:
          type: string
          description: Safe lifecycle detail without secrets or host paths
        image:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: sbx-01
        state: Pending
        reason: CREATE_ACCEPTED
        message: Sandbox creation has been accepted.
        image: alpine:3.22
        created_at: "2026-07-25T10:30:00Z"
        updated_at: "2026-07-25T10:30:00Z"
