openapi: 3.1.0
info:
  title: MiniSandbox Lifecycle API
  version: 0.3.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Control plane is healthy
  /readyz:
    get:
      operationId: ready
      responses:
        "200":
          description: Control plane is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more required control-plane components are not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /v1/sandboxes:
    post:
      operationId: createSandbox
      description: >-
        Without Idempotency-Key every accepted call creates a new sandbox. Within retention,
        the same key and presence-aware canonical request replays the first 202 status,
        Location, and safe response body; a different request returns 409. Only committed 202
        results are retained. Every replay receives a fresh X-Request-ID response header, and
        the server-computed absolute expires_at is not part of the request identity.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
      responses:
        "202":
          description: Sandbox creation was accepted
          headers:
            Location:
              required: true
              description: Stable resource path returned by the first accepted request and every replay
              schema:
                type: string
            X-Request-ID:
              required: true
              description: Fresh request identifier for this transport attempt, including replays
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sandboxes/{sandbox_id}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: getSandbox
      responses:
        "200":
          description: Current sandbox state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteSandbox
      responses:
        "202":
          description: Sandbox deletion was accepted
        "204":
          description: Sandbox is already absent
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sandboxes/{sandbox_id}/renew:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    post:
      operationId: renewSandbox
      description: >-
        Extends the absolute lease expiration. Equality is an idempotent 200 no-op;
        shortening, an already expired lease, or a submitted termination intent returns
        409. Invalid RFC3339 or server TTL boundaries return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewSandboxRequest"
      responses:
        "200":
          description: Sandbox lease was extended or the requested expiration was an idempotent no-op
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sandboxes/{sandbox_id}/executions:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    post:
      operationId: executeSandboxCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteRequest"
            examples:
              foregroundArgv:
                value:
                  argv: [go, test, ./...]
                  cwd: /workspace
                  env:
                    CI: "true"
                  timeout_seconds: 120
                  background: false
      responses:
        "200":
          description: Foreground execution event stream ending in exactly one terminal event
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames whose data JSON conforms to ExecutionEvent
        "202":
          description: Background execution was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionDescriptor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sandboxes/{sandbox_id}/executions/{execution_id}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/ExecutionID"
    get:
      operationId: getSandboxExecution
      responses:
        "200":
          description: Current execution state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: cancelSandboxExecution
      responses:
        "202":
          description: Cancellation of a running execution was accepted
        "204":
          description: Execution is already terminal
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sandboxes/{sandbox_id}/executions/{execution_id}/logs:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/ExecutionID"
    get:
      operationId: getSandboxExecutionLogs
      parameters:
        - $ref: "#/components/parameters/LogCursor"
        - $ref: "#/components/parameters/LogPageLimit"
      responses:
        "200":
          description: Execution events after the supplied sequence cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionLogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sandboxes/{sandbox_id}/capabilities:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: getSandboxCapabilities
      description: >-
        Reports the features the current runner actually provides. The control plane
        only serves this for a Running sandbox and proxies the runner response
        unchanged; clients must treat every feature as independently optional.
      responses:
        "200":
          description: Capabilities currently provided by the sandbox runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sandboxes/{sandbox_id}/files/stat:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    post:
      operationId: statSandboxFile
      description: Returns metadata for one path relative to the sandbox workspace root
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileStatRequest"
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileStat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sandboxes/{sandbox_id}/directories/list:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    post:
      operationId: listSandboxDirectory
      description: Returns the direct children of one workspace directory; no pagination or snapshot guarantees in this version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectoryListRequest"
      responses:
        "200":
          description: Directory entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sandboxes/{sandbox_id}/directories:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    post:
      operationId: createSandboxDirectory
      description: Creates one workspace directory; with parents it creates missing ancestors and is idempotent for existing directories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MkdirRequest"
      responses:
        "200":
          description: Directory already existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileStat"
        "201":
          description: Directory was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileStat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sandboxes/{sandbox_id}/files/content:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    put:
      operationId: uploadSandboxFile
      description: >-
        Streams raw bytes into one workspace file. The upload is atomic: the target
        becomes visible only after the complete body was written and published.
      parameters:
        - $ref: "#/components/parameters/FilePath"
        - $ref: "#/components/parameters/FileOverwrite"
        - $ref: "#/components/parameters/FileCreateParents"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Existing file was replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileStat"
        "201":
          description: File was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileStat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: downloadSandboxFile
      description: Streams the raw bytes of one workspace regular file
      parameters:
        - $ref: "#/components/parameters/FilePath"
      responses:
        "200":
          description: File content stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sandboxes/{sandbox_id}/files/move:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    post:
      operationId: moveSandboxFile
      description: Renames one path inside the same workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileMoveRequest"
      responses:
        "200":
          description: Move completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileStat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sandboxes/{sandbox_id}/files/delete:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    post:
      operationId: deleteSandboxFile
      description: >-
        Deletes one file, symlink, or directory. Directories require recursive
        unless empty. Deleting a missing path succeeds; the workspace root cannot
        be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileDeleteRequest"
      responses:
        "204":
          description: Path is gone
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sandboxes/{sandbox_id}/pty:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: openSandboxPTY
      description: >-
        WebSocket upgrade using subprotocol minisandbox.pty.v1. One connection owns
        exactly one PTY session. The first client text frame must be a PTYStart
        message; afterwards client binary frames are stdin, client text frames are
        PTYResize messages, server binary frames are merged PTY output, and server
        text frames are PTYServerEvent messages (started, terminal, error). The
        connection ends after the single terminal event; closing the connection
        cancels the process group.
      responses:
  /v1/sandboxes/{sandbox_id}/ports/{port}/http/{path}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/PortNumber"
      - $ref: "#/components/parameters/ProxyPath"
    get:
      operationId: proxySandboxHTTPGet
      description: >-
        Forwards one plain HTTP/1.1 request to the loopback service listening on the
        given port inside this sandbox. The trailing path is a deep wildcard. The
        destination is always 127.0.0.1 inside the sandbox network namespace; callers
        cannot choose a host, scheme, or socket. Control-plane credentials and
        hop-by-hop headers are removed before forwarding. WebSocket upgrades,
        CONNECT, and raw TCP are not supported.
      responses:
        "200":
          description: Upstream response status, headers, and body are passed through
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: proxySandboxHTTPPost
      description: See proxySandboxHTTPGet; request bodies are streamed with limits
      responses:
        "200":
          description: Upstream response status, headers, and body are passed through
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: proxySandboxHTTPPut
      description: See proxySandboxHTTPGet; request bodies are streamed with limits
      responses:
        "200":
          description: Upstream response status, headers, and body are passed through
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: proxySandboxHTTPPatch
      description: See proxySandboxHTTPGet; request bodies are streamed with limits
      responses:
        "200":
          description: Upstream response status, headers, and body are passed through
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: proxySandboxHTTPDelete
      description: See proxySandboxHTTPGet
      responses:
        "200":
          description: Upstream response status, headers, and body are passed through
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    head:
      operationId: proxySandboxHTTPHead
      description: See proxySandboxHTTPGet; no response body is forwarded
      responses:
        "200":
          description: Upstream response status and headers are passed through
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional key scoped to local:v1. Exactly zero or one field-value is accepted; repeated
        field-lines or comma-joined values are invalid. The raw key is never returned or logged.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    SandboxID:
      name: sandbox_id
      in: path
      required: true
      schema:
        type: string
    ExecutionID:
      name: execution_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    LogCursor:
      name: cursor
      in: query
      required: false
      description: Last event sequence already read; omitted is equivalent to zero
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    LogPageLimit:
      name: limit
      in: query
      required: false
      description: Maximum events requested; omitted or zero uses the server-side maximum
      schema:
        type: integer
        format: int32
        minimum: 0
    FilePath:
      name: path
      in: query
      required: true
      description: Workspace-relative path; "." addresses the workspace root
      schema:
        type: string
    FileOverwrite:
      name: overwrite
      in: query
      required: false
      description: Whether an existing regular file may be atomically replaced
      schema:
        type: boolean
        default: false
    FileCreateParents:
      name: create_parents
      in: query
      required: false
      description: Whether missing parent directories are created before the upload
      schema:
        type: boolean
        default: false
    PortNumber:
      name: port
      in: path
      required: true
      description: TCP port of the loopback service inside the sandbox; must be within the server-allowed range
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 65535
    ProxyPath:
      name: path
      in: path
      required: true
      description: Deep wildcard path forwarded to the sandbox loopback service, including its query string
      schema:
        type: string
  responses:
    BadRequest:
      description: Request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Sandbox does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Server policy forbids the requested capability
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current sandbox state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected internal error occurred
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required control-plane dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Execution cannot be started with the supplied semantic values
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: A sandbox or execution admission limit has been reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The uploaded or requested file exceeds the configured size limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: The sandbox loopback service could not be reached or misbehaved
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
      example:
        error:
          code: INVALID_REQUEST
          message: Request is invalid.
          request_id: req-01
          retryable: false
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
          description: Stable machine-readable error code
        message:
          type: string
          description: Safe error detail without secrets or internal causes
        request_id:
          type: string
          description: Request identifier also returned in the X-Request-ID header
        retryable:
          type: boolean
          description: Whether retrying later may succeed without changing the request
    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - SANDBOX_NOT_FOUND
        - SANDBOX_CONFLICT
        - SANDBOX_NOT_RUNNING
        - INVALID_EXECUTION_REQUEST
        - EXECUTION_NOT_FOUND
        - EXECUTION_LIMIT_REACHED
        - SHELL_NOT_FOUND
        - INVALID_CWD
        - RUNNER_UNHEALTHY
        - RUNNER_PROTOCOL_MISMATCH
        - OUTBOUND_NOT_ALLOWED
        - EGRESS_IMAGE_UNAVAILABLE
        - EGRESS_POLICY_INVALID
        - EGRESS_NOT_READY
        - EGRESS_UNHEALTHY
        - INVALID_TTL
        - INVALID_EXPIRATION
        - LEASE_CONFLICT
        - SANDBOX_EXPIRING
        - IDEMPOTENCY_CONFLICT
        - SANDBOX_LIMIT_REACHED
        - ADMIN_DISABLED
        - RUNTIME_UNAVAILABLE
        - NOT_IMPLEMENTED
        - INTERNAL_ERROR
        - INVALID_FILE_PATH
        - FILE_NOT_FOUND
        - FILE_TYPE_MISMATCH
        - FILE_CONFLICT
        - FILE_TOO_LARGE
        - FILES_UNAVAILABLE
        - PTY_UNAVAILABLE
        - PTY_LIMIT_REACHED
        - INVALID_PORT
        - PORT_PROXY_UNAVAILABLE
        - PORT_UPSTREAM_UNAVAILABLE
      x-phase3-error-contract:
        INVALID_TTL:
          http_status: 400
          retryable: false
          message: Sandbox TTL is invalid.
        INVALID_EXPIRATION:
          http_status: 400
          retryable: false
          message: Sandbox expiration is invalid.
        LEASE_CONFLICT:
          http_status: 409
          retryable: false
          message: Sandbox lease conflicts with the current expiration.
        SANDBOX_EXPIRING:
          http_status: 409
          retryable: false
          message: Sandbox is expiring or terminating.
        IDEMPOTENCY_CONFLICT:
          http_status: 409
          retryable: false
          message: Idempotency key conflicts with a different request.
        SANDBOX_LIMIT_REACHED:
          http_status: 429
          retryable: true
          message: Sandbox limit has been reached.
        ADMIN_DISABLED:
          http_status: 404
          retryable: false
          message: Admin API is not available.
    CreateSandboxRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
        ttl_seconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 86400
          description: Optional lease duration in whole seconds; omission selects the server default
        network:
          $ref: "#/components/schemas/SandboxNetworkRequest"
    SandboxNetworkRequest:
      type: object
      additionalProperties: false
      properties:
        outbound:
          type: boolean
          default: false
    RenewSandboxRequest:
      type: object
      additionalProperties: false
      required: [expires_at]
      properties:
        expires_at:
          type: string
          format: date-time
          description: Absolute requested expiration; the server normalizes accepted values to UTC
    ExecuteRequest:
      type: object
      additionalProperties: false
      properties:
        argv:
          type: array
          minItems: 1
          prefixItems:
            - type: string
              minLength: 1
          items:
            type: string
        shell:
          type: string
          minLength: 1
        cwd:
          type: string
          description: Container path below /workspace; defaults to /workspace
        env:
          type: object
          additionalProperties:
            type: string
        timeout_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Execution timeout in seconds; zero selects the runner default
        background:
          type: boolean
          default: false
      oneOf:
        - required: [argv]
        - required: [shell]
    ExecutionState:
      type: string
      enum: [Pending, Running, Exited, Failed, Cancelled, TimedOut]
    ExecutionDescriptor:
      type: object
      additionalProperties: false
      required: [execution_id, state]
      properties:
        execution_id:
          type: string
        state:
          $ref: "#/components/schemas/ExecutionState"
    ExecutionStatus:
      type: object
      additionalProperties: false
      required: [execution_id, state]
      properties:
        execution_id:
          type: string
        state:
          $ref: "#/components/schemas/ExecutionState"
        terminal_event:
          $ref: "#/components/schemas/TerminalExecutionEvent"
    ExecutionLogPage:
      type: object
      additionalProperties: false
      required: [events, next_cursor, complete]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionEvent"
        next_cursor:
          type: integer
          format: int64
          minimum: 0
        complete:
          type: boolean
    ExecutionEvent:
      oneOf:
        - $ref: "#/components/schemas/StartedEvent"
        - $ref: "#/components/schemas/StdoutEvent"
        - $ref: "#/components/schemas/StderrEvent"
        - $ref: "#/components/schemas/OutputLimitReachedEvent"
        - $ref: "#/components/schemas/ExitedEvent"
        - $ref: "#/components/schemas/FailedEvent"
        - $ref: "#/components/schemas/CancelledEvent"
        - $ref: "#/components/schemas/TimedOutEvent"
      discriminator:
        propertyName: type
    TerminalExecutionEvent:
      oneOf:
        - $ref: "#/components/schemas/ExitedEvent"
        - $ref: "#/components/schemas/FailedEvent"
        - $ref: "#/components/schemas/CancelledEvent"
        - $ref: "#/components/schemas/TimedOutEvent"
      discriminator:
        propertyName: type
    StartedEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: started}
    OutputLimitReachedEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: output_limit_reached}
    StdoutEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type, data_base64]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: stdout}
        data_base64: {type: string, format: byte}
    StderrEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type, data_base64]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: stderr}
        data_base64: {type: string, format: byte}
    ExitedEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type, exit_code, duration_ms, output_truncated]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: exited}
        exit_code: {type: integer}
        duration_ms: {type: integer, format: int64, minimum: 0}
        output_truncated: {type: boolean}
    FailedEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type, error_code, message, duration_ms, output_truncated]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: failed}
        error_code: {type: string}
        message: {type: string}
        duration_ms: {type: integer, format: int64, minimum: 0}
        output_truncated: {type: boolean}
    CancelledEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type, duration_ms, output_truncated]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: cancelled}
        duration_ms: {type: integer, format: int64, minimum: 0}
        output_truncated: {type: boolean}
    TimedOutEvent:
      type: object
      additionalProperties: false
      required: [execution_id, sequence, timestamp, type, duration_ms, output_truncated]
      properties:
        execution_id: {type: string}
        sequence: {type: integer, format: int64, minimum: 1}
        timestamp: {type: string, format: date-time}
        type: {type: string, const: timed_out}
        duration_ms: {type: integer, format: int64, minimum: 0}
        output_truncated: {type: boolean}
    ReadinessStatus:
      type: string
      enum: [ready, not_ready]
    ReadinessComponentName:
      type: string
      enum: [store, docker, artifact, recovery, worker]
    ReadinessComponent:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          $ref: "#/components/schemas/ReadinessComponentName"
        status:
          $ref: "#/components/schemas/ReadinessStatus"
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, components]
      properties:
        status:
          $ref: "#/components/schemas/ReadinessStatus"
        components:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/ReadinessComponent"
    SandboxState:
      type: string
      enum:
        - Pending
        - Creating
        - Running
        - Stopping
        - Terminated
        - Failed
    SandboxReason:
      type: string
      enum:
        - CREATE_ACCEPTED
        - CREATING_RUNTIME
        - WAITING_RUNNER
        - RUNNING
        - DELETE_ACCEPTED
        - DELETING_RUNTIME
        - TERMINATED
        - IMAGE_PULL_FAILED
        - ARTIFACT_INVALID
        - CONTAINER_CREATE_FAILED
        - ARTIFACT_INJECTION_FAILED
        - CONTAINER_START_FAILED
        - RUNNER_UNHEALTHY
        - RUNNER_PROTOCOL_MISMATCH
        - EGRESS_UNHEALTHY
        - SPEC_DRIFT
        - CLEANUP_PENDING
        - RUNTIME_UNAVAILABLE
        - INTERNAL_ERROR
        - RETRY_SCHEDULED
        - RECOVERING_RUNTIME
        - RUNNER_HEALTH_DEGRADED
        - TTL_EXPIRED
        - ORPHAN_IMPORTED
        - ORPHAN_EXPIRED
      x-reason-contract:
        CREATE_ACCEPTED:
          states: [Pending]
          message: Sandbox creation has been accepted.
        CREATING_RUNTIME:
          states: [Creating]
          message: Preparing sandbox runtime.
        WAITING_RUNNER:
          states: [Creating]
          message: Waiting for sandbox runner.
        RUNNING:
          states: [Running]
          message: Sandbox is running.
        DELETE_ACCEPTED:
          states: [Stopping]
          message: Sandbox deletion has been accepted.
        DELETING_RUNTIME:
          states: [Stopping]
          message: Deleting sandbox runtime.
        TERMINATED:
          states: [Terminated]
          message: Sandbox runtime has been deleted.
        IMAGE_PULL_FAILED:
          states: [Failed]
          message: Failed to pull sandbox image.
        ARTIFACT_INVALID:
          states: [Failed]
          message: Sandbox runtime artifacts are invalid.
        CONTAINER_CREATE_FAILED:
          states: [Failed]
          message: Failed to create sandbox container.
        ARTIFACT_INJECTION_FAILED:
          states: [Failed]
          message: Failed to inject sandbox runtime artifacts.
        CONTAINER_START_FAILED:
          states: [Failed]
          message: Failed to start sandbox container.
        RUNNER_UNHEALTHY:
          states: [Failed]
          message: Sandbox runner is unhealthy.
        RUNNER_PROTOCOL_MISMATCH:
          states: [Failed]
          message: Sandbox runner protocol is incompatible.
        EGRESS_UNHEALTHY:
          states: [Failed]
          message: Sandbox outbound isolation is unhealthy.
        SPEC_DRIFT:
          states: [Failed]
          message: Sandbox runtime does not match the persisted specification.
        CLEANUP_PENDING:
          states: [Failed, Stopping]
          message: Sandbox runtime cleanup is pending.
        RUNTIME_UNAVAILABLE:
          states: [Failed]
          message: Sandbox runtime is temporarily unavailable.
        INTERNAL_ERROR:
          states: [Failed]
          message: An unexpected internal error occurred.
        RETRY_SCHEDULED:
          states: [Failed, Creating, Stopping]
          message: Sandbox reconciliation retry is scheduled.
        RECOVERING_RUNTIME:
          states: [Creating]
          message: Sandbox runtime is being recovered.
        RUNNER_HEALTH_DEGRADED:
          states: [Running]
          message: Sandbox runner health is degraded.
        TTL_EXPIRED:
          states: [Stopping]
          message: Sandbox lease has expired.
        ORPHAN_IMPORTED:
          states: [Creating, Running]
          message: Trusted sandbox resources have been imported.
        ORPHAN_EXPIRED:
          states: [Stopping]
          message: Expired sandbox resources are being deleted.
    Sandbox:
      type: object
      additionalProperties: false
      required: [id, state, reason, message, image, expires_at, created_at, updated_at]
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/SandboxState"
        reason:
          $ref: "#/components/schemas/SandboxReason"
        message:
          type: string
          description: Safe lifecycle detail without secrets or host paths
        image:
          type: string
        expires_at:
          type: string
          format: date-time
          description: Non-empty current lease expiration normalized to UTC
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: sbx-01
        state: Pending
        reason: CREATE_ACCEPTED
        message: Sandbox creation has been accepted.
        image: alpine:3.22
        expires_at: "2026-07-25T11:30:00Z"
        created_at: "2026-07-25T10:30:00Z"
        updated_at: "2026-07-25T10:30:00Z"
    Capabilities:
      type: object
      additionalProperties: false
      required: [files, pty, http_port_proxy]
      properties:
        files:
          type: boolean
          description: Workspace file management is available on this sandbox
        pty:
          type: boolean
          description: Interactive PTY sessions are available on this sandbox
        http_port_proxy:
          type: boolean
          description: The loopback HTTP port proxy is available on this sandbox
      example:
        files: true
        pty: true
        http_port_proxy: true
    FileType:
      type: string
      enum: [regular, directory, symlink, other]
    FileStat:
      type: object
      additionalProperties: false
      required: [path, type, size_bytes, mode, modified_at]
      properties:
        path:
          type: string
          description: Workspace-relative path of the entry
        type:
          $ref: "#/components/schemas/FileType"
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        mode:
          type: string
          pattern: '^0[0-7]{3}$'
          description: Permission bits as a four-digit octal string, for example 0644
        modified_at:
          type: string
          format: date-time
    FileStatRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          description: Workspace-relative path; "." addresses the workspace root
    DirectoryListRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          description: Workspace-relative directory path; "." addresses the workspace root
    DirectoryListing:
      type: object
      additionalProperties: false
      required: [path, entries]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileStat"
    MkdirRequest:
      type: object
      additionalProperties: false
      required: [path, parents]
      properties:
        path:
          type: string
        parents:
          type: boolean
          description: Create missing ancestor directories; existing directories are accepted
    FileMoveRequest:
      type: object
      additionalProperties: false
      required: [source, destination, overwrite]
      properties:
        source:
          type: string
        destination:
          type: string
        overwrite:
          type: boolean
          description: Whether an existing destination entry may be replaced; directories cannot be replaced
    FileDeleteRequest:
      type: object
      additionalProperties: false
      required: [path, recursive]
      properties:
        path:
          type: string
        recursive:
          type: boolean
          description: Delete directories with content; never follows symlinks
    PTYStart:
      type: object
      additionalProperties: false
      required: [type, argv, cols, rows, timeout_seconds]
      properties:
        type:
          type: string
          const: start
        argv:
          type: array
          minItems: 1
          items:
            type: string
        cwd:
          type: string
          description: Workspace-relative working directory; defaults to the workspace root
        env:
          type: object
          additionalProperties:
            type: string
        cols:
          type: integer
          minimum: 1
          maximum: 500
        rows:
          type: integer
          minimum: 1
          maximum: 300
        timeout_seconds:
          type: integer
          format: int64
          minimum: 0
    PTYResize:
      type: object
      additionalProperties: false
      required: [type, cols, rows]
      properties:
        type:
          type: string
          const: resize
        cols:
          type: integer
          minimum: 1
          maximum: 500
        rows:
          type: integer
          minimum: 1
          maximum: 300
    PTYServerEvent:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [started, terminal, error]
        exit_code:
          type: integer
          description: Present only on terminal events for processes that exited
        duration_ms:
          type: integer
          format: int64
          minimum: 0
          description: Present only on terminal events
        error_code:
          type: string
          description: Present only on error and failed-terminal events
        message:
          type: string
          description: Safe human-readable detail; no command content or secrets
