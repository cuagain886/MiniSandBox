server:
  listen_address: "127.0.0.1:8080"
  shutdown_timeout: "10s"

data:
  directory: "/var/lib/minisandbox"
  sqlite_path: "/var/lib/minisandbox/sandboxd.db"

runtime:
  type: "docker"
  docker_host: "unix:///var/run/docker.sock"
  default_image: "debian:bookworm-slim"
  runner_socket_directory: "/var/lib/minisandbox/run"
  workspace_directory: "/var/lib/minisandbox/workspaces"
  network_mode: "none"
  workspace_persistent: false
  platform:
    os: "linux"
    arch: "amd64"

reconcile:
  interval: "10s"
  jitter: "2s"
  timeout: "2m"
  page_size: 100
  max_concurrent: 8
  retry_min: "1s"
  retry_max: "1m"
  running_check_interval: "30s"
  runner_unhealthy_threshold: 3
  docker_freshness: "30s"
  runner_ready_timeout: "30s"
  deletion_timeout: "30s"

limits:
  default_ttl: "30m"
  maximum_ttl: "24h"
  max_sandboxes: 100
  max_concurrent_creates: 4
  max_concurrent_image_pulls: 2
  max_concurrent_deletes: 4
  default_resources:
    cpu_quota_millis: 500
    memory_mib: 512
    pids: 128
  max_resources:
    cpu_quota_millis: 4000
    memory_mib: 8192
    pids: 1024

runner:
  # runnerd 与用户命令最终都使用该固定非 root 身份；它必须不同于宿主机 socket owner。
  execution_uid: 1000
  execution_gid: 1000
  default_cwd: "/workspace"
  default_timeout: "10m"
  max_timeout: "1h"
  termination_grace: "2s"
  max_concurrent_executions: 8
  max_request_bytes: 1048576
  max_output_bytes: 10485760
  max_env_vars: 128
  max_env_key_bytes: 128
  max_env_value_bytes: 8192
  max_env_total_bytes: 65536
  max_log_page_events: 256
  max_log_page_bytes: 1048576
  completed_retention: "1h"
  max_retained_executions: 100
  sse_write_timeout: "15s"

security:
  # 必须指向非 symlink、权限不宽于 0600、恰好 32 字节的 regular file；不要把密钥写入 YAML。
  runner_master_key_file: "/etc/minisandbox/runner-master-key"
  # 默认关闭；只有服务端开启且创建请求显式 network.outbound=true 时才创建 egress sidecar。
  allow_outbound: false

egress:
  # 启用 allow_outbound 前必须替换为已批准、带 SBOM/provenance 的 repository@sha256 精确引用。
  image: ""
  protocol_version: 1
  ready_timeout: "30s"
  # 只能追加 deny；代码内置内部/保留 CIDR 以及实际 Docker subnet/gateway 永远不能删除。
  egress_denied_cidrs: []
  anchor_uid: 65532
  anchor_gid: 65532
  limits:
    cpu_quota_millis: 100
    memory_mib: 64
    pids: 16
